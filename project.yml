name: F50Manager
options:
  bundleIdPrefix: cn.f50
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  xcodeVersion: "26.3"
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: targeted
    TARGETED_DEVICE_FAMILY: "1,2"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
packages:
  swift-nio:
    url: https://github.com/apple/swift-nio.git
    exactVersion: 2.81.0
  swift-nio-ssl:
    url: https://github.com/apple/swift-nio-ssl.git
    exactVersion: 2.29.0
targets:
  F50Manager:
    type: application
    platform: iOS
    sources:
      - F50App
      - F50Core
    info:
      path: F50App/Info.plist
      properties:
        CFBundleDisplayName: F50 Manager
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        NSBluetoothAlwaysUsageDescription: "发现并连接您附近的 F50，通过加密蓝牙读取状态、管理短信和设备设置。"
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cn.f50.manager.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - package: swift-nio
        product: NIOCore
      - package: swift-nio
        product: NIOEmbedded
      - package: swift-nio
        product: NIOTLS
      - package: swift-nio-ssl
        product: NIOSSL
  F50ManagerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
        excludes:
          - Fixtures
      - path: Tests/Fixtures
        buildPhase: resources
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cn.f50.manager.ios.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: F50Manager
      - package: swift-nio
        product: NIOCore
      - package: swift-nio
        product: NIOEmbedded
      - package: swift-nio
        product: NIOTLS
      - package: swift-nio-ssl
        product: NIOSSL
  F50ManagerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cn.f50.manager.ios.uitests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: F50Manager
schemes:
  F50Manager:
    build:
      targets:
        F50Manager: all
        F50ManagerTests: [test]
        F50ManagerUITests: [test]
    test:
      targets: [F50ManagerTests, F50ManagerUITests]
      gatherCoverageData: true
